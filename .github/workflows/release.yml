name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.4.2-beta.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: gradle/actions/wrapper-validation@v4

      - name: Derive version
        id: v
        run: |
          set -euo pipefail
          NAME="${TAG#v}"
          CORE="${NAME%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$CORE"
          # versionCode = major*10000 + minor*100 + patch
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor and patch must be < 100 (versionCode scheme)"; exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case "$NAME" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::KEYSTORE_B64 secret not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sign"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/sign/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Test, lint, assemble
        run: |
          # Windows checkouts can lose the exec bit; the wrapper is not runnable otherwise.
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PversionName="${{ steps.v.outputs.name }}" \
            -PversionCode="${{ steps.v.outputs.code }}" \
            :core:net:test :core:apns:test :core:bark:test :core:update:test \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify signature and package
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          [ -n "$SRC" ] || { echo "::error::no release APK produced"; exit 1; }
          OUT="abark-${{ steps.v.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | tee certs.txt
          # Fail the build if the artifact is debug-signed or unsigned.
          if grep -qi 'CN=Android Debug' certs.txt; then
            echo "::error::APK is debug-signed"; exit 1
          fi
          sha256sum "$OUT" > SHA256SUMS.txt
          cat certs.txt >> SHA256SUMS.txt
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          tag = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8") if pathlib.Path("CHANGELOG.md").exists() else ""
          m = re.search(rf"^##\s*\[?{re.escape(tag)}\]?.*?$(.*?)(?=^##\s|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "") or f"Release {tag}"
          pathlib.Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

      - name: Write update.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          code = int(os.environ["VERSION_CODE"])
          json.dump({
              "versionCode": code,
              "versionName": os.environ["VERSION_NAME"],
              "minSupportedVersionCode": int(os.environ.get("MIN_SUPPORTED_VERSION_CODE", 0)),
              "channel": "beta" if os.environ.get("PRERELEASE") == "true" else "stable",
              "apk": os.environ["APK_FILE"],
              "sha256": os.environ["APK_SHA"],
              "url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['TAG']}",
          }, open("update.json", "w"), indent=2)
          PY
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
          APK_FILE: ${{ steps.apk.outputs.file }}
          APK_SHA: ${{ steps.apk.outputs.sha256 }}
          MIN_SUPPORTED_VERSION_CODE: "0"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.v.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.v.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.file }}
            SHA256SUMS.txt
            update.json

      - name: Clean up signing material
        if: always()
        run: rm -rf keystore.properties "$RUNNER_TEMP/sign"
